name: Infrastructure and Application Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate Terraform and Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install amazon.aws
          ansible-galaxy collection install community.general
          ansible-galaxy collection install community.docker

      - name: Ansible Syntax Check
        working-directory: ansible
        run: ansible-playbook playbooks/site.yml --syntax-check

  deploy:
    name: Deploy through AWS SSM
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Discover TaskFlow server
        id: discover
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=production-server-automation" \
              "Name=tag:Role,Values=application-server" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "TaskFlow application server not found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Discovered instance: $INSTANCE_ID"

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ steps.discover.outputs.instance_id }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions TaskFlow deployment" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/taskflow",
              "git fetch origin main",
              "git reset --hard origin/main",
              "docker compose -f app/docker-compose.yml up -d --build",
              "systemctl reload nginx"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM"
          exit 1

      - name: Verify deployment
        env:
          INSTANCE_ID: ${{ steps.discover.outputs.instance_id }}
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "Application server: $PUBLIC_IP"

          for i in {1..12}; do
            if curl --fail --silent --show-error \
              --connect-timeout 5 \
              "http://$PUBLIC_IP/health"; then
              echo
              echo "TaskFlow health check passed"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "TaskFlow health check failed"
          exit 1
