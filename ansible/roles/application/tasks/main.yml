---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Clone TaskFlow repository
  ansible.builtin.git:
    repo: "{{ github_repo }}"
    dest: "{{ app_dir }}"
    version: main
    force: true
  become_user: "{{ app_user }}"

- name: Build and start TaskFlow
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/app"
    state: present
    build: always
